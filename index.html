<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAPCART | Premium Store</title>
    <link rel="icon" type="image/jpeg" href="bagwhite.png.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2874f0;
            --primary-dark: #1a56bd;
            --secondary: #fb641b;
            --whatsapp: #25D366;
            --bg: #f8fafc;
            --text: #1e293b;
            --white: #ffffff;
            --star: #ffc107;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }

        .trust-bar { background: #0f172a; color: #fff; padding: 8px 5%; font-size: 11px; font-weight: 600; text-align: center; display: flex; justify-content: center; gap: 20px; letter-spacing: 0.5px; }
        .trust-item i { color: var(--secondary); margin-right: 5px; }

        header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 12px 5%; position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow-md); }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .logo { font-weight: 800; font-size: 24px; display: flex; align-items: center; gap: 10px; }
        .logo img { height: 35px; border-radius: 8px; }
        
        .search-bar { display: flex; background: white; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
        .search-bar input { border: none; padding: 12px 15px; width: 100%; outline: none; font-size: 14px; }
        .search-bar button { background: white; border: none; padding: 0 15px; color: var(--primary); cursor: pointer; }

        .container { padding: 20px 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 1100px; margin: auto; }
        
        .product-card { background: white; border-radius: 20px; padding: 10px; display: flex; flex-direction: column; transition: 0.3s; border: 1px solid #f1f5f9; position: relative; }
        .img-container { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; border-radius: 12px; background: #f8fafc; }
        .product-img { width: 100%; height: 100%; object-fit: contain; transition: 0.5s ease; }
        
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.9); border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 10px; color: var(--primary); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; }
        .prev-btn { left: 5px; }
        .next-btn { right: 5px; }

        .viewer-count { font-size: 9px; color: #ef4444; font-weight: 700; margin-bottom: 5px; display: flex; align-items: center; gap: 4px; }
        .viewer-dot { width: 5px; height: 5px; background: #ef4444; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .p-title { font-size: 13px; font-weight: 600; margin: 8px 0; height: 36px; overflow: hidden; color: #334155; line-height: 1.4; }
        .p-price { font-size: 16px; font-weight: 800; color: #0f172a; }
        .add-btn { background: var(--secondary); color: white; border: none; padding: 10px; font-weight: 700; cursor: pointer; border-radius: 10px; margin-top: 10px; font-size: 11px; text-transform: uppercase; }

        .sidebar { position: fixed; right: -100%; top: 0; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 6000; padding: 25px; transition: 0.5s; box-shadow: -15px 0 40px rgba(0,0,0,0.1); display: flex; flex-direction: column; box-sizing: border-box; }
        .sidebar.active { right: 0; }
        .full-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); z-index: 5000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 450px; border-radius: 24px; padding: 20px; position: relative; }

        .whatsapp-buy { background: var(--whatsapp); color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 12px; font-weight: 700; margin-top: 15px; }
        
        .float-icon { position: fixed; width: 55px; height: 55px; border-radius: 18px; display: flex; justify-content: center; align-items: center; color: white; font-size: 22px; cursor: pointer; z-index: 4000; box-shadow: var(--shadow-lg); }
        .wa-btn-float { bottom: 20px; right: 20px; background: var(--whatsapp); }
    </style>
</head>
<body onload="initApp()">

<div class="trust-bar">
    <div class="trust-item"><i class="fas fa-shipping-fast"></i> FAST COD SHIPPING</div>
    <div class="trust-item"><i class="fas fa-check-circle"></i> BEST PRICE GUARANTEED</div>
</div>

<header>
    <div class="header-top">
        <div class="logo">
            <img src="bagwhite.png.jpg" alt="SnapCart">
            SNAP<span style="color: #ffe500;">CART</span>
        </div>
        <div onclick="toggleCart()" style="position:relative; cursor:pointer;">
            <i class="fas fa-shopping-bag" style="font-size:22px"></i>
            <span id="cart-count" style="position:absolute; top:-8px; right:-8px; background:var(--secondary); color:white; padding:2px 6px; border-radius:50%; font-size:10px; font-weight:bold;">0</span>
        </div>
    </div>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Find trending products..." onkeyup="search()">
        <button><i class="fas fa-search"></i></button>
    </div>
</header>

<div class="container" id="productGrid"></div>

<a href="https://wa.me/919380811781" class="float-icon wa-btn-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

<div id="productModal" class="full-modal">
    <div class="modal-content">
        <i class="fas fa-times-circle" onclick="closeModal()" style="position:absolute; right:15px; top:15px; font-size:24px; cursor:pointer; color:#cbd5e1;"></i>
        <img id="modalImg" src="" style="width:100%; height:250px; object-fit:contain; border-radius:12px;">
        <h2 id="modalTitle" style="margin:15px 0 5px; font-size:18px;"></h2>
        <div id="modalPrice" style="font-size:22px; font-weight:800; color:var(--primary);"></div>
        <p id="modalDesc" style="color:#64748b; font-size:13px; line-height:1.5;"></p>
        <a id="modalWA" class="whatsapp-buy" target="_blank"><i class="fab fa-whatsapp"></i> BUY ON WHATSAPP</a>
    </div>
</div>

<div id="cartSidebar" class="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">My Cart</h2>
        <i class="fas fa-times-circle" onclick="toggleCart()" style="cursor:pointer; font-size:24px; color:#cbd5e1;"></i>
    </div>
    <div id="cart-list" style="flex-grow:1; overflow-y:auto; padding-top:20px;"></div>
    <div style="border-top:1px solid #f1f5f9; padding-top:15px;">
        <div style="display:flex; justify-content:space-between; font-weight:800; font-size:18px; margin-bottom:10px;">
            <span>Total:</span> <span id="totalPrice">₹0</span>
        </div>
        <button class="whatsapp-buy" onclick="checkout()" style="width:100%; border:none; cursor:pointer;">ORDER VIA WHATSAPP</button>
    </div>
</div>

<script>
    const MY_NUM = "919380811781";
    let cart = [];

    const products = [
        { 
            id: 1, 
            name: "High-Power Cordless Car Vacuum & Blower", 
            price: 799, 
            imgs: ["Car1.webp", "Car2.webp", "Car3.webp", "Car4.webp"], 
            currentImg: 0,
            desc: "Keep your car spotless! Powerful suction for dirt and blower mode for narrow gaps. USB Rechargeable." 
        },
        { 
            id: 2, 
            name: "Portable USB Electric Juicer Blender", 
            price: 799, 
            imgs: ["Blender1.webp", "Blender2.webp"], 
            currentImg: 0,
            desc: "Smoothies on the go! 6-Blade powerful motor, rechargeable via Type-C. Easy to clean and carry." 
        },
        { 
            id: 3, 
            name: "Mini Handheld Electric Sewing Machine", 
            price: 599, 
            imgs: ["Stitch2.webp"], 
            currentImg: 0,
            desc: "Portable and cordless. Fix clothes in seconds! Perfect for travel and emergency repairs." 
        },
        { 
            id: 4, 
            name: "Foldable Face Ice Therapy Plunge Bowl", 
            price: 299, 
            imgs: ["Face1.webp", "Face2.webp", "Face3.webp"], 
            currentImg: 0,
            desc: "Viral Skincare Trend! Reduces facial puffiness, tightens skin, and feels refreshing. Collapsible design." 
        }
    ];

    function initApp() { render(products); }

    function render(data) {
        document.getElementById('productGrid').innerHTML = data.map(p => {
            const viewers = Math.floor(Math.random() * 12) + 5;
            return `
            <div class="product-card" id="card-${p.id}">
                <div class="viewer-count"><div class="viewer-dot"></div> ${viewers} browsing now</div>
                <div class="img-container">
                    ${p.imgs.length > 1 ? `<button class="slider-btn prev-btn" onclick="changeImg(${p.id}, -1)">❮</button>` : ''}
                    <img src="${p.imgs[p.currentImg]}" class="product-img" id="img-${p.id}" onclick="openProduct(${p.id})">
                    ${p.imgs.length > 1 ? `<button class="slider-btn next-btn" onclick="changeImg(${p.id}, 1)">❯</button>` : ''}
                </div>
                <div class="p-title">${p.name}</div>
                <div class="p-price">₹${p.price}</div>
                <button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
            `;
        }).join('');
    }

    function changeImg(id, direction) {
        const p = products.find(x => x.id === id);
        p.currentImg = (p.currentImg + direction + p.imgs.length) % p.imgs.length;
        document.getElementById(`img-${id}`).src = p.imgs[p.currentImg];
        event.stopPropagation();
    }

    function addToCart(id) {
        const p = products.find(x => x.id === id);
        cart.push({...p, cartId: Math.random()});
        updateCartUI();
    }

    function updateCartUI() {
        document.getElementById('cart-count').innerText = cart.length;
        document.getElementById('cart-list').innerHTML = cart.map(p => `
            <div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f1f5f9;">
                <img src="${p.imgs[0]}" style="width:50px; height:50px; border-radius:8px; object-fit:contain;">
                <div style="flex:1;"><p style="margin:0; font-size:12px; font-weight:700;">${p.name}</p><p style="margin:0; color:var(--primary); font-weight:800;">₹${p.price}</p></div>
                <i class="fas fa-trash-alt" onclick="remove(${p.cartId})" style="color:#cbd5e1; cursor:pointer;"></i>
            </div>
        `).join('');
        document.getElementById('totalPrice').innerText = "₹" + cart.reduce((s, p) => s + p.price, 0);
    }

    function remove(cid) { cart = cart.filter(x => x.cartId !== cid); updateCartUI(); }
    function toggleCart() { document.getElementById('cartSidebar').classList.toggle('active'); }
    function openProduct(id) {
        const p = products.find(x => x.id === id);
        document.getElementById('modalImg').src = p.imgs[p.currentImg];
        document.getElementById('modalTitle').innerText = p.name;
        document.getElementById('modalPrice').innerText = "₹" + p.price;
        document.getElementById('modalDesc').innerText = p.desc;
        document.getElementById('modalWA').href = `https://wa.me/${MY_NUM}?text=Hi SnapCart, I want the ${p.name}. Total ₹${p.price}. Is COD available?`;
        document.getElementById('productModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('productModal').style.display = 'none'; }
    function checkout() {
        if(cart.length === 0) return alert("Cart is empty!");
        const details = cart.map(p => p.name).join(', ');
        const total = cart.reduce((s, p) => s + p.price, 0);
        const msg = `Hi SnapCart, Order Request:\n\nItems: ${details}\nTotal: ₹${total}\n\nDeliver to my address via COD.`;
        window.open(`https://wa.me/${MY_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>
</body>
</html>
